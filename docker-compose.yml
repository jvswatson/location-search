name: location-search

services:
  db:
    build:
      context: docker/db
    image: location-search-db:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airports}
      POSTGRES_DB: ${POSTGRES_DB:-airports}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
